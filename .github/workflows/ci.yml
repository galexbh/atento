name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # toma la versión de "packageManager" en package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (vulnerabilidades altas o críticas)
        run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:workers
      - run: pnpm build
      - name: Validar configuración de Wrangler (sin desplegar)
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache-navegadores
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.cache-navegadores.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.cache-navegadores.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Variables locales para las pruebas (.dev.vars no está en el repo)
        run: |
          HASH=$(pnpm exec tsx scripts/hash-password.ts "atento-admin-local-2026" | grep -E '^pbkdf2\$' | tail -1)
          {
            echo "ENTORNO=local"
            echo "TURNSTILE_SECRET="
            echo "RATE_SALT=sal-de-pruebas-ci"
            echo "ADMIN_MODO=password"
            echo "ADMIN_PASSWORD_HASH=$HASH"
            echo "ADMIN_SESSION_SECRET=secreto-de-sesion-ci"
          } > .dev.vars
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
