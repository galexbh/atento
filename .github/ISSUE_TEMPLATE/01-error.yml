name: Reportar un error
description: Algo no funciona como debería (cuestionario, resultado, mapa, API, panel).
title: "[Error] "
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Si el problema es una **vulnerabilidad de seguridad**, no lo
        describas aquí: sigue [SECURITY.md](../blob/main/SECURITY.md).
        No incluyas datos de niños, niñas o familias reales ni capturas con información personal.
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Describe el problema con tus palabras.
      placeholder: Al pulsar "Siguiente" en la página 3 del cuestionario, se vuelve a la página 1.
    validations:
      required: true
  - type: textarea
    id: que-esperabas
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abrir /cribado/consentimiento
        2. Aceptar y continuar
        3. ...
  - type: input
    id: url
    attributes:
      label: Página o ruta afectada
      placeholder: https://atento.galexbh.dev/cribado/cuestionario
  - type: dropdown
    id: entorno
    attributes:
      label: Dónde lo viste
      options:
        - Producción (atento.galexbh.dev)
        - Preview (atento-preview.galexbh.dev)
        - Local (pnpm dev)
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo, sistema y navegador
      placeholder: Android 14, Chrome 130 / Windows 11, Firefox 132
  - type: input
    id: fecha
    attributes:
      label: Fecha y hora aproximadas
      placeholder: 2026-10-11 15:30 (hora de Honduras)
  - type: textarea
    id: extra
    attributes:
      label: Información adicional
      description: Mensajes de error, capturas sin datos personales, consola del navegador.
